active_modules:
  # Core EVSE Manager - orchestrates the charging session
  evse_manager:
    module: EvseManager
    config_implementation:
      evse_manager:
        connector_id: 1
        evse_id: "DE*WB*E12345"
        evse_id_din: "49A80737A06"
        payment_enable_eim: true
        payment_enable_contract: false
        ac_nominal_voltage: 230
        ev_receipt_required: false
        session_logging: true
        session_logging_path: "./logs/"
        three_phases: true
        has_ventilation: true
        country_code: "DE"
        rcd_enabled: true
        max_current_import_A: 32
        max_current_export_A: 0
        charge_mode: "AC"
        ac_hlc_enabled: true
        ac_hlc_use_5percent: false
        ac_enforce_hlc: false
        ac_with_soc: false
    connections:
      bsp:
        - module_id: py_whitebeet_driver
          implementation_id: evse_board_support
      slac:
        - module_id: py_whitebeet_driver
          implementation_id: slac
      hlc:
        - module_id: py_whitebeet_driver
          implementation_id: charger
      powermeter:
        - module_id: py_whitebeet_driver
          implementation_id: powermeter
      rcd:
        - module_id: py_whitebeet_driver
          implementation_id: rcd
      connector_lock:
        - module_id: py_whitebeet_driver
          implementation_id: connector_lock
      energy_manager:
        - module_id: energy_manager
          implementation_id: energy_manager
      token_provider:
        - module_id: auth
          implementation_id: token_provider

  # Python WhiteBeet Ethernet Driver - main hardware interface
  py_whitebeet_driver:
    module: PyWhiteBeetEthDriver
    config_implementation:
      main:
        # Network Configuration
        ip_address: "192.168.1.100"      # WhiteBeet module IP address
        port: 15118                      # WhiteBeet HCI TCP port
        connection_timeout: 5000         # Connection timeout in milliseconds
        reconnect_interval: 10000        # Reconnection attempt interval in milliseconds
        
        # EVSE Identity and Configuration
        evse_id: "DE*WB*E12345"         # EVSE identifier (must match evse_manager)
        vendor_id: "8devices"           # Hardware vendor identifier
        model_name: "WHITE-beet-EI"     # Hardware model name
        firmware_version: "1.0.0"      # Expected firmware version
        
        # Electrical Limits and Configuration
        max_current_l1: 32.0            # Phase L1 maximum current in Amperes
        max_current_l2: 32.0            # Phase L2 maximum current in Amperes  
        max_current_l3: 32.0            # Phase L3 maximum current in Amperes
        max_voltage: 400.0              # Maximum voltage in Volts
        nominal_voltage: 230.0          # Nominal AC voltage per phase
        frequency: 50.0                 # Grid frequency in Hz
        phases: 3                       # Number of phases (1 or 3)
        
        # SLAC (Signal Level Attenuation Characterization) Configuration
        slac_enabled: true              # Enable SLAC functionality
        slac_set_key_timeout_ms: 500    # SLAC set key timeout
        slac_matching_timeout_s: 10     # SLAC matching timeout in seconds
        slac_sounding_attenuation: 20   # SLAC sounding attenuation threshold
        enable_autostart: true          # Auto-start SLAC on module initialization
        
        # RCD (Residual Current Device) Configuration
        rcd_enabled: true               # Enable RCD monitoring and protection
        rcd_threshold_ma: 30            # RCD trip threshold in milliamperes (30mA typical)
        rcd_check_interval_ms: 100     # RCD monitoring interval in milliseconds
        
        # Connector Lock Configuration
        connector_lock_enabled: true    # Enable connector lock functionality
        lock_timeout_ms: 5000          # Lock/unlock operation timeout in milliseconds
        unlock_on_error: true          # Automatically unlock on error conditions
        
        # ISO 15118 Protocol Configuration
        iso15118_enabled: true          # Enable ISO 15118 HLC functionality
        iso15118_ac_three_phase_supported: true  # Support for 3-phase AC charging
        iso15118_ac_single_phase_supported: true # Support for 1-phase AC charging
        iso15118_dc_supported: false    # DC charging support (not supported by this hardware)
        iso15118_internet_supported: false       # Internet connectivity support
        iso15118_free_service: true     # Support for free charging service
        iso15118_energy_transfer_mode: "AC_three_phase_core"  # Default energy transfer mode
        
        # Powermeter Configuration
        powermeter_enabled: true        # Enable integrated power measurement
        powermeter_poll_interval_ms: 1000  # Power measurement polling interval
        power_smoothing_enabled: true   # Enable power value smoothing
        
        # Communication and Protocol Settings
        message_timeout_ms: 3000        # General message response timeout
        heartbeat_interval_ms: 5000     # Heartbeat message interval
        protocol_version: "1.0"        # WhiteBeet HCI protocol version
        
        # Safety and Error Handling
        emergency_stop_enabled: true    # Enable emergency stop functionality
        overvoltage_protection: true    # Enable overvoltage protection
        undervoltage_protection: true   # Enable undervoltage protection
        overcurrent_protection: true    # Enable overcurrent protection
        overtemperature_protection: true # Enable overtemperature protection
        
        # Logging and Debug Configuration
        debug_mode: false               # Enable detailed debug logging
        log_raw_messages: false         # Log raw HCI messages (for debugging)
        telemetry_enabled: true         # Enable telemetry data collection
        telemetry_interval_ms: 1000     # Telemetry update interval in milliseconds

  # Energy Manager - handles energy flow and limits
  energy_manager:
    module: EnergyManager
    config_implementation:
      main:
        nominal_ac_voltage: 230
        update_interval: 1
        schedule_interval_duration: 60
        schedule_total_duration: 1440

  # Authentication Manager - handles user authorization
  auth:
    module: Auth
    config_implementation:
      main:
        selection_algorithm: "PlugAndCharge"
        connection_timeout: 10
        master_pass_group_id: "default"
        prioritize_authorization_over_stopping_transaction: true
        ignore_connector_faults: false
    connections:
      token_provider:
        - module_id: token_provider_dummy
          implementation_id: auth_token_provider
      token_validator:
        - module_id: token_validator_dummy
          implementation_id: auth_token_validator
      evse_manager:
        - module_id: evse_manager
          implementation_id: auth

  # Simple token provider for testing
  token_provider_dummy:
    module: DummyTokenProvider
    config_implementation:
      main:
        token: "DEADBEEF"
        type: "ISO14443"

  # Simple token validator for testing
  token_validator_dummy:
    module: DummyTokenValidator
    config_implementation:
      main:
        sleep: 0.5
        validation_result: "Accepted"
        validation_reason: "Token valid for Python WhiteBeet driver"

# Logging Configuration
logging:
  config:
    disable_logging_to_stdout: false
    logfile: "./logs/py-whitebeet-everest.log"
    also_log_to_console: true
  loggers:
    - logger: "manager"
      level: "info"
    - logger: "py_whitebeet_driver"
      level: "debug"    # Detailed logging for Python WhiteBeet driver
    - logger: "evse_manager"
      level: "info"
    - logger: "auth"
      level: "info"
    - logger: "energy_manager"
      level: "info"

# Error Handling
error_handling:
  error_history_path: "./logs/py-whitebeet-errors.log"
  raise_framework_errors: false

# Settings
settings:
  telemetry_enabled: true
  expose_mac_addresses: false
  expose_ip_addresses: false